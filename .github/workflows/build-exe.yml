name: build

# Builds and publishes GPU Switch:
#   Windows  dist/BrouserGPUSwitch.exe                 - one self-contained file
#            dist/BrouserGPUSwitch/…                 - folder build (no unpacking)
#            dist/BrouserGPUSwitch-Setup.exe           - installer (no admin rights)
#            dist/BrouserGPUSwitch-windows.zip         - folder build as an archive
#   Linux    dist/BrouserGPUSwitch-linux-x86_64.tar.gz - portable build + install.sh
#
# Run it from the Actions tab, or push a v* tag: the builds are then attached
# to the GitHub release with that tag.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade "pyinstaller>=6.0"

      - name: Run the test suite
        run: python -m unittest discover -s tests -v

      - name: Build the application
        run: python -m PyInstaller --noconfirm --clean packaging/gpu-switch.spec

      - name: Smoke-test the application
        shell: pwsh
        run: |
          # The exe is a windows-subsystem program: PowerShell does not wait
          # for it, so start it explicitly and read the exit code.
          function Invoke-GpuSwitch([string]$Path, [string]$Arguments) {
            $startInfo = New-Object System.Diagnostics.ProcessStartInfo
            $startInfo.FileName = (Resolve-Path $Path).Path
            $startInfo.Arguments = $Arguments
            $startInfo.UseShellExecute = $false
            $startInfo.RedirectStandardOutput = $true
            $startInfo.RedirectStandardError = $true
            $process = [System.Diagnostics.Process]::Start($startInfo)
            $stdout = $process.StandardOutput.ReadToEnd()
            $stderr = $process.StandardError.ReadToEnd()
            $process.WaitForExit()
            Write-Host $stdout
            Write-Host $stderr
            return $process.ExitCode
          }
          if ((Invoke-GpuSwitch 'dist\BrouserGPUSwitch.exe' '--self-test') -ne 0) { throw "self-test failed" }
          if ((Invoke-GpuSwitch 'dist\BrouserGPUSwitch.exe' '--ui-smoke-test') -ne 0) { throw "ui-smoke-test failed" }
          if ((Invoke-GpuSwitch 'dist\BrouserGPUSwitch\BrouserGPUSwitch.exe' '--self-test') -ne 0) { throw "folder build self-test failed" }

      - name: Build the installer
        run: python -m PyInstaller --noconfirm --clean packaging/installer.spec

      - name: Smoke-test the installer
        shell: pwsh
        run: |
          function Invoke-GpuSwitch([string]$Path, [string]$Arguments) {
            $startInfo = New-Object System.Diagnostics.ProcessStartInfo
            $startInfo.FileName = (Resolve-Path $Path).Path
            $startInfo.Arguments = $Arguments
            $startInfo.UseShellExecute = $false
            $startInfo.RedirectStandardOutput = $true
            $startInfo.RedirectStandardError = $true
            $process = [System.Diagnostics.Process]::Start($startInfo)
            $stdout = $process.StandardOutput.ReadToEnd()
            $stderr = $process.StandardError.ReadToEnd()
            $process.WaitForExit()
            Write-Host $stdout
            Write-Host $stderr
            return $process.ExitCode
          }
          if ((Invoke-GpuSwitch 'dist\BrouserGPUSwitch-Setup.exe' '--silent --target=build\install-test --no-shortcuts --no-registry') -ne 0) { throw "installer failed" }
          if ((Invoke-GpuSwitch 'build\install-test\BrouserGPUSwitch.exe' '--self-test') -ne 0) { throw "installed copy failed its self-test" }

      - name: Zip the folder build
        shell: pwsh
        run: Compress-Archive -Path 'dist\BrouserGPUSwitch\*' -DestinationPath 'dist\BrouserGPUSwitch-windows.zip' -Force

      - name: Upload the Windows builds
        uses: actions/upload-artifact@v4
        with:
          name: BrouserGPUSwitch-windows
          path: |
            dist/BrouserGPUSwitch.exe
            dist/BrouserGPUSwitch-Setup.exe
            dist/BrouserGPUSwitch-windows.zip
          if-no-files-found: error

  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb
          python -m pip install --upgrade "pyinstaller>=6.0"

      - name: Run the test suite
        run: |
          python -m unittest discover -s tests -v
          xvfb-run -a python main.py --mock --ui-smoke-test

      - name: Build the portable archive
        run: |
          chmod +x build_linux.sh packaging/linux/*.sh
          ./build_linux.sh
          xvfb-run -a ./dist/BrouserGPUSwitch/BrouserGPUSwitch --self-test

      - name: Upload the Linux build
        uses: actions/upload-artifact@v4
        with:
          name: BrouserGPUSwitch-linux
          path: dist/BrouserGPUSwitch-linux-x86_64.tar.gz
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download the built artefacts
        uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            assets/BrouserGPUSwitch.exe
            assets/BrouserGPUSwitch-Setup.exe
            assets/BrouserGPUSwitch-windows.zip
            assets/BrouserGPUSwitch-linux-x86_64.tar.gz
          generate_release_notes: true
